  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const KEEP = "iwm-lock-key";
  const loaded = () => document.readyState === "complete" ? Promise.resolve() : new Promise((r) => addEventListener("load", r, { once: true }));
  async function open(key) {
    await loaded();   // replacing the page while it is still loading would append instead of replace
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
    const page = new TextDecoder().decode(plain);
    document.open(); document.write(page); document.close();
  }
  async function keyFrom(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SALT), iterations: ROUNDS, hash: "SHA-256" },

  }
  const msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!window.crypto || !crypto.subtle) { msg.textContent = "This browser can't unlock the page. Try a current Chrome, Safari, Edge, or Firefox."; go.disabled = true; return; }

  const saved = sessionStorage.getItem(KEEP);
  if (saved) {
    crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"]).then(open).catch(() => sessionStorage.removeItem(KEEP));
  }
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    go.disabled = true; msg.textContent = "Unlocking…";
    try {

      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      await open(key);
      try { sessionStorage.setItem(KEEP, btoa(String.fromCharCode(...raw))); } catch (_) {}

      msg.textContent = "Wrong password. Try again."; go.disabled = false;
    }
